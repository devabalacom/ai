name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
      - x64
      - agenthub-vps

    steps:
      - name: Update server checkout
        run: |
          git -C /opt/agenthub/ai fetch origin main
          git -C /opt/agenthub/ai reset --hard origin/main

      - name: Write runtime environment
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-1' }}
          OPENAI_IMAGE_SIZE: ${{ vars.OPENAI_IMAGE_SIZE || '1024x1024' }}
        run: |
          cd /opt/agenthub/ai
          umask 077
          {
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'OPENAI_IMAGE_MODEL=%s\n' "$OPENAI_IMAGE_MODEL"
            printf 'OPENAI_IMAGE_SIZE=%s\n' "$OPENAI_IMAGE_SIZE"
          } > .env

      - name: Rebuild and restart
        run: |
          cd /opt/agenthub/ai
          docker compose up -d --build --remove-orphans

      - name: Show containers
        run: |
          cd /opt/agenthub/ai
          docker compose ps
