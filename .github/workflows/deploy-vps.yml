name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
      - x64
      - agenthub-vps

    steps:
      - name: Update server checkout
        run: |
          git -C /opt/agenthub/ai fetch origin main
          git -C /opt/agenthub/ai reset --hard origin/main

      - name: Write runtime environment
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-1' }}
          OPENAI_IMAGE_SIZE: ${{ vars.OPENAI_IMAGE_SIZE || '1024x1024' }}
          OPENCLAW_GATEWAY_URL: ${{ vars.OPENCLAW_GATEWAY_URL }}
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
          OPENCLAW_GATEWAY_PASSWORD: ${{ secrets.OPENCLAW_GATEWAY_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd /opt/agenthub/ai
          umask 077
          read_env() {
            key="$1"
            test -f .env || return 0
            grep -m1 "^$key=" .env | cut -d= -f2-
          }
          existing_openai_api_key="$(read_env OPENAI_API_KEY)"
          existing_openai_image_model="$(read_env OPENAI_IMAGE_MODEL)"
          existing_openai_image_size="$(read_env OPENAI_IMAGE_SIZE)"
          existing_gateway_url="$(read_env OPENCLAW_GATEWAY_URL)"
          existing_gateway_token="$(read_env OPENCLAW_GATEWAY_TOKEN)"
          existing_gateway_password="$(read_env OPENCLAW_GATEWAY_PASSWORD)"
          existing_postgres_password="$(read_env POSTGRES_PASSWORD)"
          existing_database_url="$(read_env DATABASE_URL)"
          {
            printf 'OPENAI_API_KEY=%s\n' "${OPENAI_API_KEY:-$existing_openai_api_key}"
            printf 'OPENAI_IMAGE_MODEL=%s\n' "${OPENAI_IMAGE_MODEL:-${existing_openai_image_model:-gpt-image-1}}"
            printf 'OPENAI_IMAGE_SIZE=%s\n' "${OPENAI_IMAGE_SIZE:-${existing_openai_image_size:-1024x1024}}"
            printf 'OPENCLAW_GATEWAY_URL=%s\n' "${OPENCLAW_GATEWAY_URL:-$existing_gateway_url}"
            printf 'OPENCLAW_GATEWAY_TOKEN=%s\n' "${OPENCLAW_GATEWAY_TOKEN:-$existing_gateway_token}"
            printf 'OPENCLAW_GATEWAY_PASSWORD=%s\n' "${OPENCLAW_GATEWAY_PASSWORD:-$existing_gateway_password}"
            printf 'POSTGRES_PASSWORD=%s\n' "${POSTGRES_PASSWORD:-$existing_postgres_password}"
            printf 'DATABASE_URL=%s\n' "${DATABASE_URL:-$existing_database_url}"
          } > .env

      - name: Rebuild and restart
        run: |
          cd /opt/agenthub/ai
          docker compose up -d --build --remove-orphans

      - name: Show containers
        run: |
          cd /opt/agenthub/ai
          docker compose ps
